<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/train.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RailFlow · Indian Railways High-Contention Control Plane</title>
    <script>
      (function() {
        const theme = localStorage.getItem('railflow-theme') || 'dark';
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-cyan-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
